<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loading video</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        .loading-screen {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
    </style>
</head>
<body>
    <img class="loading-screen" src="assets/redirect-loading.png" alt="Loading video">
    <script type="text/javascript">
        (function() {
            var targetUrl = "https://www.youtube.com/watch?v=Eq5R-eQjcQg";
            var redirectDelayMs =1500;

            // Start the delay once the loading screen is ready to display.
            window.addEventListener("load", function() {
                window.setTimeout(function() {
                    window.location.replace(targetUrl);
                }, redirectDelayMs);
            });
        })();
    </script>
</body>
</html>
